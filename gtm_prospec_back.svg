<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <style><![CDATA[
  @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');
  .pf  { font-family: 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif; font-weight: 400; }
  .pfi { font-family: 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif; font-weight: 400; font-style: italic; }
  .inter { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 400; }
  .interi { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 400; font-style: italic; }
]]></style>
    <radialGradient id="bgBack" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#F4EFE4"/>
      <stop offset="100%" stop-color="#ECE6D8"/>
    </radialGradient>
  </defs>

  <!-- fundo com sangria — variação muito sutil de bege -->
  <rect x="0" y="0" width="960" height="560" fill="url(#bgBack)"/>

  <!-- logo (escuro) no topo, centralizado -->
  <image href="assets/gtm_logo_dark.png" x="460.74" y="36" width="38.52" height="54" preserveAspectRatio="xMidYMin meet"/>

  <!-- ornamento decorativo (ecoa o da frente) -->
  <g stroke="#5A8578" stroke-opacity="0.55" stroke-linecap="round">
    <line x1="370" y1="122" x2="440" y2="122" stroke-width="0.6"/>
    <circle cx="455" cy="122" r="1.4" fill="#5A8578" fill-opacity="0.75" stroke="none"/>
    <circle cx="480" cy="122" r="1.4" fill="#5A8578" fill-opacity="0.75" stroke="none"/>
    <circle cx="505" cy="122" r="1.4" fill="#5A8578" fill-opacity="0.75" stroke="none"/>
    <line x1="520" y1="122" x2="590" y2="122" stroke-width="0.6"/>
  </g>

  <!-- HEADLINE — itálico Playfair, ar boutique -->
  <text x="480" y="158" text-anchor="middle" class="pfi" font-size="24" fill="#1F3A35" letter-spacing="0.01em">
    Fale direto com um sócio.
  </text>

  <!-- divisórias verticais entre as colunas — com pontinho central -->
  <g stroke="#1F3A35" stroke-opacity="0.18" stroke-width="0.8" stroke-linecap="round">
    <line x1="340" y1="188" x2="340" y2="289"/>
    <line x1="340" y1="299" x2="340" y2="400"/>
    <line x1="620" y1="188" x2="620" y2="289"/>
    <line x1="620" y1="299" x2="620" y2="400"/>
  </g>
  <circle cx="340" cy="294" r="1.6" fill="#1F3A35" fill-opacity="0.35"/>
  <circle cx="620" cy="294" r="1.6" fill="#1F3A35" fill-opacity="0.35"/>

  
    <!-- João Giovanini -->
    <text x="200" y="198" text-anchor="middle" class="pf" font-size="22" fill="#1F3A35" letter-spacing="0.02em">João Giovanini</text>
    <text x="200" y="220" text-anchor="middle" class="interi" font-size="12" fill="#5A8578" letter-spacing="0.02em">Direito Trabalhista</text>
    <text x="200" y="252" text-anchor="middle" class="inter" font-size="14" fill="#1F3A35" font-weight="500" letter-spacing="0.03em">(61) 99945-4564</text>
    <image href="assets/qr_joao.png" x="146" y="270" width="108" height="108"/>
    <text x="200" y="392" text-anchor="middle" class="inter" font-size="9" fill="#5A8578" letter-spacing="0.4em" font-weight="500">WHATSAPP</text>
  

    <!-- Giovanna Trombini -->
    <text x="480" y="198" text-anchor="middle" class="pf" font-size="22" fill="#1F3A35" letter-spacing="0.02em">Giovanna Trombini</text>
    <text x="480" y="220" text-anchor="middle" class="interi" font-size="12" fill="#5A8578" letter-spacing="0.02em">Direito Digital</text>
    <text x="480" y="252" text-anchor="middle" class="inter" font-size="14" fill="#1F3A35" font-weight="500" letter-spacing="0.03em">(61) 99695-8863</text>
    <image href="assets/qr_giovanna.png" x="426" y="270" width="108" height="108"/>
    <text x="480" y="392" text-anchor="middle" class="inter" font-size="9" fill="#5A8578" letter-spacing="0.4em" font-weight="500">WHATSAPP</text>
  

    <!-- Rafael Mansur -->
    <text x="760" y="198" text-anchor="middle" class="pf" font-size="22" fill="#1F3A35" letter-spacing="0.02em">Rafael Mansur</text>
    <text x="760" y="220" text-anchor="middle" class="interi" font-size="12" fill="#5A8578" letter-spacing="0.02em">Direito do Servidor Público</text>
    <text x="760" y="252" text-anchor="middle" class="inter" font-size="14" fill="#1F3A35" font-weight="500" letter-spacing="0.03em">(61) 99269-7534</text>
    <image href="assets/qr_rafael.png" x="706" y="270" width="108" height="108"/>
    <text x="760" y="392" text-anchor="middle" class="inter" font-size="9" fill="#5A8578" letter-spacing="0.4em" font-weight="500">WHATSAPP</text>
  

  <!-- separador horizontal acima do rodapé -->
  <g stroke="#1F3A35" stroke-opacity="0.18" stroke-width="0.6" stroke-linecap="round">
    <line x1="120" y1="460" x2="460" y2="460"/>
    <line x1="500" y1="460" x2="840" y2="460"/>
  </g>
  <circle cx="480" cy="460" r="1.6" fill="#1F3A35" fill-opacity="0.35"/>

  <!-- rodapé: contato do escritório -->
  <text x="480" y="490" text-anchor="middle" class="inter" font-size="11" fill="#1F3A35" letter-spacing="0.16em">
    @gtm.advocacia<tspan dx="18" fill="#5A8578">·</tspan><tspan dx="18">contato@gtmadvocacia.com.br</tspan>
  </text>
</svg>
