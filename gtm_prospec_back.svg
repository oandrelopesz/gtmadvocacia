    <text x="760" y="374" text-anchor="middle" class="inter" font-size="9" fill="#5A8578" letter-spacing="0.3em">whatsapp</text>
  

  <!-- separador horizontal acima do rodapé -->
  <line x1="120" y1="470" x2="840" y2="470" stroke="#1F3A35" stroke-opacity="0.18" stroke-width="1"/>

  <!-- rodapé: contato do escritório -->
