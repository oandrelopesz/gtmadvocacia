<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <style><![CDATA[
  @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');
  .pf  { font-family: 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif; font-weight: 400; }
  .pfi { font-family: 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif; font-weight: 400; font-style: italic; }
  .inter { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 400; }
  .interi { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 400; font-style: italic; }
]]></style>
  </defs>

  <!-- fundo com sangria -->
  <rect x="0" y="0" width="960" height="560" fill="#F1ECE0"/>

  <!-- logo (escuro) no topo, centralizado -->
  <image href="assets/gtm_logo_dark.png" x="460.025" y="38" width="39.95" height="56" preserveAspectRatio="xMidYMin meet"/>

  <!-- HEADLINE (sem nicho de área) -->
  <text x="480" y="140" text-anchor="middle" class="pf" font-size="24" fill="#1F3A35">
    Fale direto com um sócio.
  </text>

  <!-- divisórias verticais entre as colunas -->
  <line x1="340" y1="180" x2="340" y2="405" stroke="#1F3A35" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="620" y1="180" x2="620" y2="405" stroke="#1F3A35" stroke-opacity="0.2" stroke-width="1"/>

  
    <!-- João Giovanini -->
    <text x="200" y="200" text-anchor="middle" class="pf" font-size="22" fill="#1F3A35" letter-spacing="0.02em">João Giovanini</text>
    <text x="200" y="232" text-anchor="middle" class="inter" font-size="14" fill="#1F3A35" font-weight="500">(61) 99945-4564</text>
    <image href="assets/qr_joao.png" x="145" y="252" width="110" height="110"/>
    <text x="200" y="374" text-anchor="middle" class="inter" font-size="9" fill="#5A8578" letter-spacing="0.3em">whatsapp</text>
  

    <!-- Giovanna Trombini -->
    <text x="480" y="200" text-anchor="middle" class="pf" font-size="22" fill="#1F3A35" letter-spacing="0.02em">Giovanna Trombini</text>
    <text x="480" y="232" text-anchor="middle" class="inter" font-size="14" fill="#1F3A35" font-weight="500">(61) 99695-8863</text>
    <image href="assets/qr_giovanna.png" x="425" y="252" width="110" height="110"/>
    <text x="480" y="374" text-anchor="middle" class="inter" font-size="9" fill="#5A8578" letter-spacing="0.3em">whatsapp</text>
  

    <!-- Rafael Mansur -->
    <text x="760" y="200" text-anchor="middle" class="pf" font-size="22" fill="#1F3A35" letter-spacing="0.02em">Rafael Mansur</text>
